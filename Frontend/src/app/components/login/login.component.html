<div class="login-container">
  <div class="left-content">
    <div class="hero-content">
      <i class="pi pi-microchip-ai"></i>
      <h1 class="platform-title">Welcome to Datalake Platform</h1>
      <p class="platform-subtitle">Sign in to access your account</p>
    </div>
  </div>

  <div class="right-content">
    <div class="card login-card">
      <div class="login-header">
        <i class="pi pi-user-plus login-icon"></i>
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to your account</p>
      </div>

      <form [formGroup]="userForm" (ngSubmit)="onLogin()" class="flex flex-column gap-4">

        <!-- Email -->
        <div class="field">
          <label for="email" class="block text-900 font-medium mb-2">
            <i class="pi pi-envelope field-icon"></i>
            Email
          </label>

          <div class="p-inputgroup">
            <span class="p-inputgroup-addon">
              <i class="pi pi-envelope"></i>
            </span>

            <input
              pInputText
              id="email"
              type="email"
              formControlName="email"
              class="w-full"
              placeholder="Enter your email"
            />
          </div>

          <small
            *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched"
            class="p-error block mt-1"
          >
            <i class="pi pi-exclamation-triangle"></i>

            <ng-container *ngIf="userForm.get('email')?.errors?.['required']">
              Email is required.
            </ng-container>

            <ng-container *ngIf="userForm.get('email')?.errors?.['email']">
              Please enter a valid email address.
            </ng-container>
          </small>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password" class="block text-900 font-medium mb-2">
            <i class="pi pi-lock field-icon"></i>
            Password
          </label>

          <div class="p-inputgroup">
            <span class="p-inputgroup-addon">
              <i class="pi pi-lock"></i>
            </span>

            <input
              pInputText
              id="password"
              formControlName="password"
              type="password"
              class="w-full"
              placeholder="Enter your password"
            />
          </div>

          <small
            *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched"
            class="p-error block mt-1"
          >
            <i class="pi pi-exclamation-triangle"></i>

            <ng-container *ngIf="userForm.get('password')?.errors?.['required']">
              Password is required.
            </ng-container>

            <ng-container *ngIf="userForm.get('password')?.errors?.['minlength']">
              Password must be at least 2 characters.
            </ng-container>
          </small>
        </div>

        <div class="button-container">
          <p-button
            label="Sign In"
            type="submit"
            icon="pi pi-sign-in"
            styleClass="login-button"
            [disabled]="userForm.invalid"
            [loading]="isLoading">
          </p-button>
        </div>

      </form>
    </div>
  </div>
</div>
