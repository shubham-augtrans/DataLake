services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    networks:
      - iceberg_net
    environment:
      POSTGRES_USER: shubham
      POSTGRES_PASSWORD: Shubham@123456
      POSTGRES_DB: datalake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shubham -d datalake"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: shubham
      MB_DB_PASS: Shubham@123456
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase.db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  superset-init:
    build:
      context: ./superset
    container_name: superset-init
    restart: "no"
    networks:
      - iceberg_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: datalake-superset-dev-secret-change-me
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/grant_public_access.py:/app/pythonpath/grant_public_access.py:ro
    entrypoint: /bin/sh
    # One-shot: migrate Superset's own metadata DB, seed roles/permissions,
    # create the admin account SupersetClient logs in as (same purpose as
    # the airflow-init service does for Airflow), and grant the Public
    # role the blanket access published dashboards need to actually be
    # viewable unauthenticated (see grant_public_access.py).
    command:
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username shubham --firstname Shubham --lastname Sapkal --email shubham@datalake.local --password Shubham@123456 || true &&
        superset init &&
        superset shell < /app/pythonpath/grant_public_access.py

  superset:
    build:
      context: ./superset
    container_name: superset
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: datalake-superset-dev-secret-change-me
    ports:
      - "8088:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_data:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    networks:
      - iceberg_net
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: BROKER://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_BROKER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="shubham" password="Shubham@123456"
        user_shubham="Shubham@123456";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="shubham" password="Shubham@123456"
        user_shubham="Shubham@123456";
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-broker cluster: the internal __consumer_offsets/transaction
      # topics default to replication factor 3, which can never be
      # satisfied here - they silently fail to create, which breaks every
      # consumer group (coordinator discovery hangs forever) while
      # producing and plain metadata calls keep working fine, masking it.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="shubham" password="Shubham@123456";
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: shubham
      SPRING_SECURITY_USER_PASSWORD: Shubham@123456
    ports:
      - "8089:8080"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - iceberg_net
    environment:
      GF_SECURITY_ADMIN_USER: shubham
      GF_SECURITY_ADMIN_PASSWORD: Shubham@123456
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    networks:
      - iceberg_net
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: shubham
      DOCKER_INFLUXDB_INIT_PASSWORD: Shubham@123456
      DOCKER_INFLUXDB_INIT_ORG: datalake
      DOCKER_INFLUXDB_INIT_BUCKET: datalake
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  nifi-driver-init:
    image: curlimages/curl:latest
    container_name: nifi-driver-init
    restart: "no"
    user: "0:0"
    volumes:
      - nifi_drivers:/drivers
    # Downloads the Postgres JDBC driver once into a shared volume so NiFi's
    # DBCPConnectionPool can reference it - not bundled in the stock NiFi image,
    # and not committed to git as a binary.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /drivers/postgresql.jar ]; then
          curl -fsSL -o /drivers/postgresql.jar \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
        fi

  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi
    hostname: nifi
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nifi-driver-init:
        condition: service_completed_successfully
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"
      NIFI_WEB_PROXY_HOST: "nifi:8443,localhost:8443"
      NIFI_SENSITIVE_PROPS_KEY: "Shubham@123456"
      NIFI_JVM_HEAP: "1g"
      SINGLE_USER_CREDENTIALS_USERNAME: shubham
      SINGLE_USER_CREDENTIALS_PASSWORD: "Shubham@123456"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: shubham
      MINIO_SECRET_KEY: "Shubham@123456"
    ports:
      - "8443:8443"
    volumes:
      - nifi_drivers:/opt/nifi/nifi-current/drivers
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost:8443/nifi/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      AWS_ACCESS_KEY_ID: shubham
      AWS_SECRET_ACCESS_KEY: "Shubham@123456"
      AWS_REGION: us-east-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  spark-worker:
    image: apache/spark:3.5.6
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_WEBUI_PORT: "8081"
      AWS_ACCESS_KEY_ID: shubham
      AWS_SECRET_ACCESS_KEY: "Shubham@123456"
      AWS_REGION: us-east-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  iceberg-rest-init:
    image: busybox:latest
    container_name: iceberg-rest-init
    restart: "no"
    volumes:
      - iceberg_rest_data:/tmp/iceberg-rest
    # The fixture image runs as uid 1000; a fresh named volume is root-owned,
    # so hand it over once before the real service starts.
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /tmp/iceberg-rest"]

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.1
    container_name: iceberg-rest
    hostname: iceberg-rest
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
      iceberg-rest-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: shubham
      AWS_SECRET_ACCESS_KEY: "Shubham@123456"
      AWS_REGION: us-east-1
      # Persist the fixture's catalog metadata (namespaces/tables) to a file-backed
      # SQLite DB instead of the default in-memory one, so it survives restarts.
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:/tmp/iceberg-rest/catalog.db
      CATALOG_JDBC_SCHEMA__VERSION: V1
      # MinIO as the S3-compatible object store backing the catalog's warehouse.
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
    ports:
      - "8181:8181"
    volumes:
      - iceberg_rest_data:/tmp/iceberg-rest
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/v1/config >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  trino:
    image: trinodb/trino:470
    container_name: trino
    hostname: trino
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: shubham
      AWS_SECRET_ACCESS_KEY: "Shubham@123456"
    volumes:
      - ./trino/etc:/etc/trino
      - trino_ranger_policycache:/etc/ranger/trino/policycache
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  ollama:
    image: ollama/ollama:0.33.2
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    networks:
      - iceberg_net
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:0.33.2
    container_name: ollama-init
    restart: "no"
    networks:
      - iceberg_net
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Pulls the model into the ollama service's shared volume once; a no-op
    # (fast exit) on subsequent `docker compose up` runs since it's already cached.
    # 1.5b chosen over 0.5b after live testing: 0.5b frequently produced broken/
    # semantically wrong SQL (missing GROUP BY, wrong column, invalid aggregates).
    # 1.5b is meaningfully more reliable while still running fast on CPU-only hosts;
    # 3b was tested too but is impractically slow here without a GPU.
    entrypoint: ["ollama", "pull", "qwen2.5:1.5b"]

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      spark-master:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      JUPYTER_TOKEN: "Shubham@123456"
      AWS_ACCESS_KEY_ID: shubham
      AWS_SECRET_ACCESS_KEY: "Shubham@123456"
      AWS_REGION: us-east-1
    ports:
      - "8888:8888"
    volumes:
      - jupyter_data:/home/jovyan/work

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: shubham
      MINIO_ROOT_PASSWORD: "Shubham@123456"
      MINIO_DOMAIN: minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mc:
    image: minio/mc:latest
    container_name: mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - iceberg_net
    environment:
      AWS_ACCESS_KEY_ID: shubham
      AWS_SECRET_ACCESS_KEY: "Shubham@123456"
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 shubham 'Shubham@123456' &&
      mc mb --ignore-existing minio/warehouse &&
      mc mb --ignore-existing minio/staging
      "

  ranger-db:
    image: apache/ranger-db:2.8.0
    container_name: ranger-db
    hostname: ranger-db
    restart: unless-stopped
    networks:
      - iceberg_net
    environment:
      # The apache/ranger admin image's setup script hardcodes db_root_user=postgres,
      # so this superuser must be named exactly "postgres" for it to connect.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Shubham@123456"
      POSTGRES_DB: ranger
    volumes:
      - ranger_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ranger"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ranger:
    image: apache/ranger:2.8.0
    container_name: ranger
    hostname: ranger
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      ranger-db:
        condition: service_healthy
    environment:
      RANGER_VERSION: "2.8.0"
      RANGER_DB_TYPE: postgres
      # Read by ranger.sh at first boot: connects to ranger-db as the "postgres"
      # superuser using this password, then creates the "rangeradmin" app DB user
      # and the Ranger Admin UI login (both using RANGER_DB_PASSWORD).
      POSTGRES_PASSWORD: "Shubham@123456"
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: "Shubham@123456"
    volumes:
      - ranger_admin_data:/var/log/ranger
    ports:
      - "6080:6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6080/login.jsp >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 180s
    command:
      - /home/ranger/scripts/ranger.sh

  # Orchestrates the ingestion pipelines that already exist in the Django
  # app (apps.ingestion) - Airflow itself has no pipeline logic, it just
  # calls the same POST /api/ingestion-pipelines/{id}/run/ endpoint the UI's
  # "Run" button calls, on a schedule, with retries. Django runs on the host
  # (see the commented-out "backend" service above), not in this compose
  # file, so the DAG reaches it via host.docker.internal.
  airflow-db-init:
    image: postgres:16
    container_name: airflow-db-init
    networks:
      - iceberg_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "Shubham@123456"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        EXISTS=$$(psql -h postgres -U shubham -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='airflow'")
        if [ "$$EXISTS" != "1" ]; then
          psql -h postgres -U shubham -d postgres -c "CREATE DATABASE airflow OWNER shubham"
        fi
    restart: "no"

  airflow-init:
    image: apache/airflow:2.10.4
    container_name: airflow-init
    networks:
      - iceberg_net
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://shubham:Shubham%40123456@postgres:5432/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "utc"
      AIRFLOW__WEBSERVER__SECRET_KEY: "dev-airflow-secret-key-change-me"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      # Read by the DAG (dags/ingestion_pipelines_dag.py) to reach the
      # Django API and log in as a real app user, the same way the
      # frontend does - no separate "service account" concept exists in
      # apps.users yet, so this must be a real login for an existing user.
      DATALAKE_BACKEND_URL: "http://host.docker.internal:8000/api"
      DATALAKE_SERVICE_EMAIL: "shubham@datalake.local"
      DATALAKE_SERVICE_PASSWORD: "Shubham@123456"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@datalake.local || true
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.10.4
    container_name: airflow-webserver
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    ports:
      - "8085:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  airflow-scheduler:
    image: apache/airflow:2.10.4
    container_name: airflow-scheduler
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$HOSTNAME\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

