services:
  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      minio:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  spark-worker:
    image: apache/spark:3.5.6
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_WEBUI_PORT: "8081"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s


  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi
    hostname: nifi
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"
      NIFI_WEB_PROXY_HOST: "nifi:8443,localhost:8443"
      NIFI_SENSITIVE_PROPS_KEY: qazplm123456
      NIFI_JVM_HEAP: "1g"
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: qazplm123456
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost:8443/nifi/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  spark-submit:
    image: apache/spark:3.5.6
    container_name: spark-submit
    hostname: spark-submit
    restart: "no"
    networks:
      - iceberg_net
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    volumes:
      - ./apps:/opt/spark-apps
      - ./ivy-cache:/tmp/ivy
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    entrypoint:
      - /opt/spark/bin/spark-submit
    command:
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --packages
      - org.mongodb.spark:mongo-spark-connector_2.12:10.3.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.hadoop.fs.s3a.endpoint=http://minio:9000
      - --conf
      - spark.hadoop.fs.s3a.access.key=admin
      - --conf
      - spark.hadoop.fs.s3a.secret.key=password
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      - --conf
      - spark.hadoop.fs.s3a.connection.ssl.enabled=false
      - --conf
      - spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      - --conf
      - spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
      - /opt/spark-apps/mongo_to_minio.py

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - "9001:9001"
      - "9000:9000"
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mc:
    image: minio/mc:latest
    container_name: mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - iceberg_net
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 admin password &&
      mc mb --ignore-existing minio/warehouse
      "

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    networks:
      - iceberg_net
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
      POSTGRES_DB: lakehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lakehouse_dump_utf8.sql:/tmp/lakehouse_dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d lakehouse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    networks:
      - iceberg_net
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongoadmin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username mongoadmin --password mongoadmin --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "18081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongoadmin:mongoadmin@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"

  trino:
    image: trinodb/trino:470
    container_name: trino
    restart: unless-stopped
    networks:
      - iceberg_net
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8082:8080"
    volumes:
      - ./trino/etc:/etc/trino
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  ranger-db:
    image: postgres:16
    container_name: ranger-db
    restart: unless-stopped
    networks:
      - iceberg_net
    environment:
      POSTGRES_USER: rangerdba
      POSTGRES_PASSWORD: rangerdba
      POSTGRES_DB: ranger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rangerdba -d ranger"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  ranger:
    image: mr3project/ranger:2.4.0
    platform: linux/amd64
    container_name: ranger
    restart: unless-stopped
    hostname: ranger
    networks:
      - iceberg_net
    depends_on:
      ranger-db:
        condition: service_healthy
    environment:
      RANGER_DB_TYPE: postgres
      RANGER_DB_HOST: ranger-db
      RANGER_DB_PORT: "5432"
      RANGER_DB_NAME: ranger
      RANGER_DB_USER: rangerdba
      RANGER_DB_PASSWORD: rangerdba
      RANGER_ADMIN_PASSWORD: password
      RANGER_AUTH_DB: "false"
      RANGER_ADMIN_USER: admin
    command: ["/opt/mr3-run/ranger/start-ranger.sh"]
    ports:
      - "6080:6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6080 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

